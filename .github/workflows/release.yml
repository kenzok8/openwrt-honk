name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: '标记为预发布版本'
        type: boolean
        default: true
      candidate:
        description: '只构建候选包，不更新正式软件源'
        type: boolean
        default: false
      auto_publish:
        description: '完整矩阵成功后自动推进 main 并发布正式版'
        type: boolean
        default: false
      base_sha:
        description: '自动推进时预期的 main SHA'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: honk-release-pipeline
  cancel-in-progress: false

jobs:
  verify_source:
    name: Verify pinned source assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check package metadata and scripts
        run: bash scripts/check.sh

      - name: Download and hash every pinned asset
        # The committed Makefiles name an immutable source-<run_id> tag, so this
        # is exactly the download a plain feed build performs. No generated file
        # may substitute for it.
        run: bash scripts/verify-source-assets.sh --download

  build:
    name: ${{ matrix.arch }} · SDK ${{ matrix.sdk }}
    needs: verify_source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9
          - x86_64
        sdk:
          - "24.10"
          - "25.12"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare SDK action
        uses: actions/checkout@v6
        with:
          repository: kenzok8/gh-action-sdk
          ref: 44f98c51d04aebd1aa79fe4f603559c1ec2085da
          path: .github/actions/gh-action-sdk
          persist-credentials: false

      - name: Fetch core provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Packages download their archives straight from the source tag named
          # in the Makefiles, hashes included, exactly like a feed build. Only
          # provenance metadata still comes from the tag; it is installed as
          # /usr/share/honk/provenance.json.
          tag=$(sed -n 's/^HONK_SOURCE_TAG?=//p' honk/Makefile)
          gh release download "$tag" --repo "${{ github.repository }}" \
            --pattern 'generated-provenance.json' --dir honk --clobber

      - name: Build packages
        id: sdk
        continue-on-error: true
        uses: ./.github/actions/gh-action-sdk
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEEDNAME: honk
          PACKAGES: honk luci-app-honk
          # wall supplies v2ray-geoip / v2ray-geosite (subpackages of v2ray-geodata)
          EXTRA_FEEDS: src-git|wall|https://github.com/kenzok8/wall
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: false
          INDEX: 1
          KEY_BUILD: ${{ secrets.OPKG_KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}

      - name: Require all release packages
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
        run: |
          set -euo pipefail
          [ "$SDK_OUTCOME" = success ] || {
            echo "::error::SDK build concluded $SDK_OUTCOME"
            exit 1
          }
          output_dir="bin/packages/${{ matrix.arch }}/honk"
          for package in honk luci-app-honk; do
            found=0
            while IFS= read -r -d '' file; do
              name=${file##*/}
              case "$name" in
                "$package"-*.apk|"$package"_*.apk|"$package"-*.ipk|"$package"_*.ipk)
                  found=1
                  break
                  ;;
              esac
            done < <(find "$output_dir" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 2>/dev/null || true)
            [ "$found" -eq 1 ] || {
              echo "::error::$package has no package for ${{ matrix.arch }} SDK ${{ matrix.sdk }}"
              exit 1
            }
          done

      - name: Collect packages
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p dist/release dist/feed
          FEED_DIR="bin/packages/${ARCH}/honk"

          for f in "$FEED_DIR"/*.ipk; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in Packages*) continue ;; esac
            base=$(basename "$f" .ipk)
            safe="${base//\~/.}"
            cp -v "$f" "dist/release/${safe}.ipk"
            cp -v "$f" dist/feed/
          done

          for f in "$FEED_DIR"/*.apk; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in Packages*|APKINDEX*|packages.adb*) continue ;; esac
            base=$(basename "$f" .apk)
            safe="${base//\~/.}"
            if echo "$safe" | grep -q "_${ARCH}\$"; then
              cp -v "$f" "dist/release/${safe}.apk"
            else
              cp -v "$f" "dist/release/${safe}-${ARCH}.apk"
            fi
            cp -v "$f" dist/feed/
          done

          for f in "$FEED_DIR"/Packages* "$FEED_DIR"/APKINDEX* "$FEED_DIR"/packages.adb*; do
            [ -f "$f" ] || continue
            cp -v "$f" dist/feed/
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: packages-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  feed-check:
    name: Feed build without generated files
    needs: verify_source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Refuse generated override files
        # A plain feed build has no honk/generated-*.mk. If one appears here the
        # check would silently mirror the CI override and prove nothing.
        run: |
          set -euo pipefail
          for file in honk/generated-stage.mk luci-app-honk/generated-doona-stage.mk; do
            [ ! -e "$file" ] || { echo "::error::$file must not exist in this check"; exit 1; }
          done

      - name: Check metadata
        run: bash scripts/check.sh

      - name: Prepare SDK action
        uses: actions/checkout@v6
        with:
          repository: kenzok8/gh-action-sdk
          ref: 44f98c51d04aebd1aa79fe4f603559c1ec2085da
          path: .github/actions/gh-action-sdk
          persist-credentials: false

      - name: Build x86_64 from committed metadata only
        id: sdk
        continue-on-error: true
        uses: ./.github/actions/gh-action-sdk
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: honk
          PACKAGES: honk luci-app-honk
          EXTRA_FEEDS: src-git|wall|https://github.com/kenzok8/wall
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: false
          # Same indexing as the release matrix so this build differs from it in
          # exactly one way: no generated override files.
          INDEX: 1
          KEY_BUILD: ${{ secrets.OPKG_KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}

      - name: Show the build log
        if: always()
        run: |
          set -euo pipefail
          echo '===== downloads'
          ls -l dl/honk-core-* dl/doona-* 2>/dev/null || true
          sha256sum dl/honk-core-*.tar.gz dl/doona-*.tar.gz 2>/dev/null || true
          echo '===== container logs'
          find logs -name '*.txt' 2>/dev/null | tail -5 || true
          for log in logs/package/feeds/honk/*/*.txt logs/feeds/honk/*/*.txt; do
            [ -f "$log" ] || continue
            echo "===== $log"
            tail -80 "$log"
          done || true
          echo '===== packages'
          find bin/packages/x86_64 -maxdepth 2 -type f \( -name '*.apk' -o -name '*.ipk' \) -print 2>/dev/null | head -20 || true

      - name: Require the package build to pass
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
        run: |
          set -euo pipefail
          [ "$SDK_OUTCOME" = success ] || {
            echo "::error::plain feed build concluded $SDK_OUTCOME"
            exit 1
          }
          for package in honk luci-app-honk; do
            find bin/packages/x86_64/honk -maxdepth 1 -type f \
              \( -name "$package-*.apk" -o -name "$package_*.apk" \
                 -o -name "$package-*.ipk" -o -name "$package_*.ipk" \) \
              -print -quit | grep -q . || {
              echo "::error::$package missing from the plain feed build"
              exit 1
            }
          done

  release:
    name: Create Release
    needs: [build, feed-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: all-artifacts
          pattern: packages-*

      - name: Flatten release files
        run: |
          set -euo pipefail
          mkdir -p dist
          count=$(find all-artifacts -mindepth 1 -maxdepth 1 -type d -name 'packages-sdk*' | wc -l)
          test "$count" -eq 12 || { echo "::error::expected 12 SDK artifacts, got $count"; exit 1; }
          find all-artifacts -path "*/release/*" -type f -exec cp -v {} dist/ \;
          # LuCI's SDK 24.10 _all.ipk is shared by all six architectures.
          test "$(find dist -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) | wc -l)" -ge 19
          (cd dist && sha256sum ./*.apk ./*.ipk > SHA256SUMS)

      - name: Record candidate and package manifest
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def assignments(path, separator):
              return dict(line.split(separator, 1) for line in Path(path).read_text().splitlines() if separator in line and not line.startswith('#'))

          def assignment_any(path, name):
              """Read NAME=..., NAME:=... or NAME?=... the way make would."""
              for line in Path(path).read_text().splitlines():
                  match = re.match(rf'^{re.escape(name)}[?:]?=', line)
                  if match:
                      return line[match.end():].strip()
              raise SystemExit(f'{name} missing from {path}')

          pins = assignments('ci/pins.env', '=')
          core = assignments('honk/Makefile', ':=')
          doona = assignments('luci-app-honk/Makefile', ':=')
          packages = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in sorted(Path('dist').iterdir()) if path.suffix in ('.apk', '.ipk')}
          manifest = {
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'base_sha': os.environ['BASE_SHA'],
              'source_tag': assignment_any('honk/Makefile', 'HONK_SOURCE_TAG'),
              'core_commit': pins['CORE_COMMIT'],
              'doona_commit': pins['DOONA_COMMIT'],
              'doona_archive': pins['DOONA_ARCHIVE'],
              'doona_archive_sha256': doona['PKG_HASH'],
              'core_archives_sha256': {key: value for key, value in core.items() if key.startswith('HONK_HASH_')},
              'honk_version': core['PKG_VERSION'] + '-r' + core['PKG_RELEASE'],
              'luci_version': doona['PKG_VERSION'] + '-r' + doona['PKG_RELEASE'],
              'sdk_sets': sorted(path.name for path in Path('all-artifacts').iterdir() if path.is_dir()),
              'packages_sha256': packages,
          }
          Path('dist/release-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Determine tag
        id: meta
        run: |
          if [ "${{ inputs.candidate }}" = true ] && [ "${{ inputs.auto_publish }}" = true ]; then
            echo "::error::candidate and auto_publish cannot both be true"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.candidate }}" = true ]; then
            echo "tag=candidate-r${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.auto_publish }}" = true ]; then
            existing_tag=$(git ls-remote --tags origin | awk -v suffix='-r${{ github.run_id }}' '$2 ~ ("^refs/tags/v.*" suffix "$") {sub("refs/tags/", "", $2); print $2}' | head -1)
            echo "tag=${existing_tag:-v$(TZ=Asia/Shanghai date +%Y.%m.%d)-r${{ github.run_id }}}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # Suffix with run_id so two dispatches on the same day don't share
            # a tag (the release action updates the release but never moves the
            # git tag, leaving tag and release out of sync).
            echo "tag=v$(TZ=Asia/Shanghai date +%Y.%m.%d)-r${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          ARCHS="aarch64_cortex-a53 aarch64_cortex-a72 aarch64_generic arm_cortex-a7_neon-vfpv4 arm_cortex-a9 x86_64"
          PREVIOUS_TAG="$(git tag --sort=-creatordate | grep '^v' | grep -v "^${TAG}$" | head -1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          git log --format='%s%x1f%b%x1e' "$RANGE" > commits.raw

          write_section() {
            title="$1"
            pattern="$2"
            awk -v title="$title" -v pattern="$pattern" '
              BEGIN { RS = "\036"; FS = "\037"; count = 0 }
              {
                subject = $1; body = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", subject)
                if (subject == "" || subject ~ /^Merge /) next
                if (subject ~ pattern) {
                  item = subject
                  sub(/^[a-z]+([(][^)]+[)])?!?:[[:space:]]*/, "", item)
                  lines[++count] = "- " item
                }
              }
              END {
                if (count > 0) { print "## " title; print ""; for (i = 1; i <= count; i++) print lines[i]; print "" }
              }
            ' commits.raw
          }

          {
            echo "# openwrt-honk ${TAG}"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "_Changes since ${PREVIOUS_TAG} / 自 ${PREVIOUS_TAG} 以来的更新。_"
            else
              echo "_Initial release notes / 初始发布说明。_"
            fi
            echo ""
            write_section "New Features / 新功能" '^feat([(][^)]+[)])?!?:'
            write_section "Improvements / 改进" '^(perf|refactor)([(][^)]+[)])?!?:'
            write_section "Bug Fixes / 问题修复" '^fix([(][^)]+[)])?!?:'
            write_section "Build & Release / 构建与发布" '^(ci|build)([(][^)]+[)])?!?:'
            write_section "Documentation / 文档" '^docs([(][^)]+[)])?!?:'
            write_section "Maintenance / 维护" '^(chore|test)([(][^)]+[)])?!?:'

            echo "## Packages / 安装包"
            echo ""
            cell_ipk() {
              pkg="$1"; arch="$2"; fallback="$3"
              f=$(ls dist/${pkg}_*_${arch}.ipk 2>/dev/null | head -1)
              [ -n "$f" ] && echo "[$(basename $f)](${BASE}/$(basename $f))" || echo "$fallback"
            }
            cell_apk() {
              pkg="$1"; arch="$2"
              f=$(ls dist/${pkg}-*-${arch}.apk 2>/dev/null | head -1)
              [ -n "$f" ] && echo "[$(basename $f)](${BASE}/$(basename $f))" || echo "—"
            }
            noarch_ipk() {
              pkg="$1"
              f=$(ls dist/${pkg}_*_all.ipk 2>/dev/null | head -1)
              [ -n "$f" ] && echo "[$(basename $f)](${BASE}/$(basename $f))" || echo "—"
            }

            echo "## 📦 SDK 24.10 · 稳定版 (IPK)"
            echo ""
            echo "| 架构 | honk | luci-app-honk |"
            echo "| :--- | :--- | :--- |"
            luci_fallback=$(noarch_ipk luci-app-honk)
            for arch in $ARCHS; do
              echo "| \`${arch}\` | $(cell_ipk honk $arch —) | $(cell_ipk luci-app-honk $arch "$luci_fallback") |"
            done

            echo ""
            echo "## 📦 SDK 25.12 · 稳定版 (APK)"
            echo ""
            echo "| 架构 | honk | luci-app-honk |"
            echo "| :--- | :--- | :--- |"
            for arch in $ARCHS; do
              echo "| \`${arch}\` | $(cell_apk honk $arch) | $(cell_apk luci-app-honk $arch) |"
            done
          } > release_notes.md

          cat release_notes.md

      - name: Promote validated commit and tag atomically
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          TAG: ${{ steps.meta.outputs.tag }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          remote_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          tag_sha=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if [ "$remote_sha" = "$CANDIDATE_SHA" ] && [ "$tag_sha" = "$CANDIDATE_SHA" ]; then
            echo "main and tag already point to this validated commit"
          elif [ "$remote_sha" = "$BASE_SHA" ] && [ -z "$tag_sha" ]; then
            git config user.name kenzok8
            git config user.email kenzok8@gmail.com
            git tag "$TAG" "$CANDIDATE_SHA"
            git -c credential.helper='!gh auth git-credential' push --atomic origin \
              "$CANDIDATE_SHA:refs/heads/main" "refs/tags/$TAG:refs/tags/$TAG"
          else
            echo "::error::main/tag changed: main=$remote_sha tag=$tag_sha"
            exit 1
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # 轻量 tag 的 .object.sha 就是提交 SHA；带注释的 tag（git tag -a）这里
          # 指向 tag 对象，真正的提交在 .object.object.sha，两种都要能过。
          tag_ref_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')"
          tag_commit_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.object.sha // .object.sha')"
          test "$tag_commit_sha" = "${{ github.sha }}" || {
            echo "::error::tag $TAG resolves to $tag_commit_sha (ref $tag_ref_sha), expected ${{ github.sha }}"
            exit 1
          }
          mkdir -p published
          gh release download "$TAG" --repo "${{ github.repository }}" --dir published
          cp dist/SHA256SUMS published/SHA256SUMS.expected
          cmp dist/release-manifest.json published/release-manifest.json
          cmp dist/SHA256SUMS published/SHA256SUMS
          (cd published && sha256sum -c SHA256SUMS.expected)

  upload_feed:
    name: Upload Feed to R2
    needs: [build, release]
    runs-on: ubuntu-latest
    if: ${{ success() && (github.event_name == 'push' || inputs.auto_publish || (!inputs.candidate && !inputs.prerelease)) }}
    permissions:
      actions: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: packages-*

      - name: Organize feed structure
        run: |
          set -euo pipefail
          mkdir -p feed
          for dir in artifacts/packages-sdk*; do
            [ -d "$dir/feed" ] || continue
            name=$(basename "$dir")
            sdk=$(echo "$name" | sed 's/packages-sdk\([^-]*\)-.*/\1/')
            arch=$(echo "$name" | sed 's/packages-sdk[^-]*-//')
            # Feed layout matches the dllkids unified feed: <sdk>/<arch>/.
            target="feed/${sdk}/${arch}"
            mkdir -p "$target"
            cp -v "$dir/feed/"* "$target/" 2>/dev/null || true

            manifest=""
            for pkg in honk luci-app-honk; do
              if ls "$target"/${pkg}_*.ipk >/dev/null 2>&1; then
                f=$(basename "$(ls "$target"/${pkg}_*.ipk | sort -V | tail -1)")
              elif ls "$target"/${pkg}-*.apk >/dev/null 2>&1; then
                f=$(basename "$(ls "$target"/${pkg}-*.apk | sort -V | tail -1)")
              else
                f=""
              fi
              if [ -n "$f" ]; then
                sha=$(sha256sum "$target/$f" | awk '{print $1}')
                manifest="${manifest}${pkg}=${f}"$'\n'"${pkg}_sha256=${sha}"$'\n'
              fi
            done
            [ -n "$manifest" ] && printf '%s' "$manifest" > "$target/manifest-honk.txt"
          done
          find feed -type f | sort

      # Install rclone in its own step that holds NO secrets, so a tampered
      # download can never read the R2 keys. Pinned version + checksum verify.
      - name: Install rclone (pinned)
        env:
          RCLONE_VER: "1.69.1"
        run: |
          set -eu
          zip="rclone-v${RCLONE_VER}-linux-amd64.zip"
          base="https://downloads.rclone.org/v${RCLONE_VER}"
          curl -fsSL -o "$zip" "${base}/${zip}"
          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"
          grep " ${zip}$" SHA256SUMS | sha256sum -c -
          unzip -q "$zip"
          sudo install -m 0755 "rclone-v${RCLONE_VER}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: Upload to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && \
            [ -n "$R2_ENDPOINT" ] && [ -n "$R2_BUCKET" ] || {
              echo "::error::R2 credentials are required for a formal release"
              exit 1
            }
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          no_check_bucket = true
          EOF
          find feed -type f | grep -q . || { echo "::error::feed is empty"; exit 1; }
          destination="r2:${R2_BUCKET}/openwrt-feed/honk/"
          # Upload packages first. Publish package indexes last, so a failed
          # transfer cannot advertise a package that is not on R2 yet.
          rclone copy feed/ "$destination" --checksum --fast-list \
            --exclude 'APKINDEX*' --exclude 'Packages*' \
            --exclude 'packages.adb*' --exclude 'manifest-honk.txt' \
            --transfers 8 --checkers 16
          rclone copy feed/ "$destination" --checksum --fast-list \
            --filter '+ APKINDEX*' --filter '+ Packages*' \
            --filter '+ packages.adb*' --filter '- **' \
            --transfers 8 --checkers 16
          rclone copy feed/ "$destination" --checksum --fast-list \
            --filter '+ manifest-honk.txt' --filter '- **' \
            --transfers 8 --checkers 16
          rclone check feed/ "$destination" --one-way --checksum --fast-list

      - name: Trigger unified feed aggregation
        env:
          AGGREGATE_FEED_TOKEN: ${{ secrets.AGGREGATE_FEED_TOKEN }}
        run: |
          [ -z "$AGGREGATE_FEED_TOKEN" ] && { echo "No aggregate token, skip trigger"; exit 0; }
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${AGGREGATE_FEED_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kenzok8/openwrt-clashoo/actions/workflows/aggregate-feed.yml/dispatches \
            -d '{"ref":"main"}' || echo "Aggregate trigger failed; scheduled workflow will retry."
