name: Check honk/doona upstream

# Scheduled runs pin changed upstream commits and dispatch the full package
# matrix; only a successful candidate is promoted to main and formal feeds.

# Pinned fork: do not move CORE_COMMIT automatically. The p1 patch in
# ci/patches/honk-direct-unspec.py is written against a specific upstream
# commit and ci/build-core.sh fails loudly if the context drifts; moving the pin
# would break the core/image builds until the patch is rebased.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-bump-honk
  cancel-in-progress: false

env:
  STAGING: auto-bump-staging-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect upstream changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . ci/pins.env

          require_sha() {
            if ! [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$2 is not a full 40-character commit SHA: ${1:-<empty>}"
              exit 1
            fi
          }

          core_new=$(git ls-remote https://github.com/Glassyiris/honk.git refs/heads/feat/native-api | cut -f1)
          doona_new=$(git ls-remote https://github.com/Zakkaus/doona.git HEAD | cut -f1)
          require_sha "$core_new" core
          require_sha "$doona_new" doona

          if [ "$core_new" = "$CORE_COMMIT" ] && [ "$doona_new" = "$DOONA_COMMIT" ]; then
            echo "No upstream change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          doona_version_new=$(curl -fsSL "https://raw.githubusercontent.com/Zakkaus/doona/$doona_new/package.json" | jq -r .version)
          if [ -z "$doona_version_new" ] || [ "$doona_version_new" = null ]; then
            echo "::error::cannot read doona version from package.json at $doona_new"
            exit 1
          fi

          changes=""
          if [ "$core_new" != "$CORE_COMMIT" ]; then
            changes="core $(printf '%s' "$CORE_COMMIT" | cut -c1-7)→$(printf '%s' "$core_new" | cut -c1-7)"
          fi
          if [ "$doona_new" != "$DOONA_COMMIT" ]; then
            changes="${changes:+$changes, }doona $(printf '%s' "$DOONA_COMMIT" | cut -c1-7)→$(printf '%s' "$doona_new" | cut -c1-7)"
          fi

          {
            echo "changed=true"
            echo "core_new=$core_new"
            echo "doona_new=$doona_new"
            echo "doona_version_new=$doona_version_new"
            echo "changes=$changes"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.changed == 'true'
        with:
          node-version: '24'

      - name: Install Doona build tools
        if: steps.detect.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Stage new pins
        id: stage
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          . ci/pins.env
          core_new='${{ steps.detect.outputs.core_new }}'
          doona_new='${{ steps.detect.outputs.doona_new }}'
          today=$(TZ=Asia/Shanghai date +%Y.%m.%d)

          bump_package() {
            file=$1
            old_version=$(sed -n 's/^PKG_VERSION:=//p' "$file")
            old_release=$(sed -n 's/^PKG_RELEASE:=//p' "$file")
            case "$old_release" in ''|*[!0-9]*) echo "::error::invalid release in $file"; exit 1 ;; esac
            if [ "$old_version" = "$today" ]; then
              new_release=$((old_release + 1))
            else
              new_release=1
            fi
            sed -i -e "s/^PKG_VERSION:=.*/PKG_VERSION:=$today/" \
              -e "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$new_release/" "$file"
          }

          sed -i \
            -e "s/^CORE_COMMIT=.*/CORE_COMMIT=$core_new/" \
            -e "s/^DOONA_COMMIT=.*/DOONA_COMMIT=$doona_new/" \
            -e "s/^DOONA_VERSION=.*/DOONA_VERSION=${{ steps.detect.outputs.doona_version_new }}/" \
            ci/pins.env
          if [ "$core_new" != "$CORE_COMMIT" ]; then
            sed -i "s/^CORE_COMMIT:=.*/CORE_COMMIT:=$core_new/" honk/Makefile
            bump_package honk/Makefile
          fi
          if [ "$doona_new" != "$DOONA_COMMIT" ]; then
            provisional="doona-$(printf '%s' "$doona_new" | cut -c1-8)-candidate.tar.gz"
            sed -i "s/^DOONA_ARCHIVE=.*/DOONA_ARCHIVE=$provisional/" ci/pins.env
            ci/build-doona.sh
            doona_hash=$(sha256sum "artifacts/cache/$provisional" | cut -d' ' -f1)
            doona_archive="doona-$(printf '%s' "$doona_new" | cut -c1-8)-$(printf '%s' "$doona_hash" | cut -c1-12).tar.gz"
            mv "artifacts/cache/$provisional" "artifacts/cache/$doona_archive"
            sed -i "s/^DOONA_ARCHIVE=.*/DOONA_ARCHIVE=$doona_archive/" ci/pins.env
            sed -i -e "s/^PKG_SOURCE:=.*/PKG_SOURCE:=$doona_archive/" \
              -e "s/^PKG_HASH:=.*/PKG_HASH:=$doona_hash/" luci-app-honk/Makefile
            bump_package luci-app-honk/Makefile
          fi
          bash scripts/check.sh

          git config user.name kenzok8
          git config user.email kenzok8@gmail.com
          git checkout -B "$STAGING"
          git add ci/pins.env honk/Makefile luci-app-honk/Makefile
          git commit -m "Update Honk upstream pins" \
            -m "改动：写入上游 pin，honk $(sed -n 's/^PKG_VERSION:=//p' honk/Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' honk/Makefile)，luci-app-honk $(sed -n 's/^PKG_VERSION:=//p' luci-app-honk/Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' luci-app-honk/Makefile)。" \
            -m "原因：将上游变更固定到可验证的候选包。"
          echo "staging_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Publish candidate branch and immutable Doona source
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . ci/pins.env
          git -c credential.helper='!gh auth git-credential' \
            push origin "HEAD:refs/heads/$STAGING"
          if [ -s "artifacts/cache/$DOONA_ARCHIVE" ]; then
            gh release view staging >/dev/null 2>&1 || \
              gh release create staging --title 'staging assets' --prerelease --latest=false
            gh release upload staging "artifacts/cache/$DOONA_ARCHIVE" --clobber
          fi

      - name: Build, promote and verify full release
        id: verify
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN branch pushes do not trigger push workflows. This
          # dispatch builds all source assets and SDK packages before promotion.
          output=$(gh workflow run release.yml --ref "$STAGING" \
            -f auto_publish=true -f base_sha='${{ steps.stage.outputs.base_sha }}')
          run_id=$(printf '%s\n' "$output" | sed -nE 's|.*actions/runs/([0-9]+).*|\1|p' | tail -1)
          case "$run_id" in ''|*[!0-9]*) echo "::error::cannot read release run ID: $output"; exit 1 ;; esac
          expected_sha='${{ steps.stage.outputs.staging_sha }}'
          actual_sha=
          for _ in $(seq 1 60); do
            actual_sha=$(gh run view "$run_id" --json headSha --jq .headSha 2>/dev/null || true)
            [ -n "$actual_sha" ] && break
            sleep 2
          done
          [ "$actual_sha" = "$expected_sha" ] || {
            echo "::error::release run $run_id uses $actual_sha, expected $expected_sha"
            exit 1
          }
          result=
          for _ in $(seq 1 240); do
            result=$(gh run view "$run_id" --json status,conclusion --jq '.status + " " + (.conclusion // "")')
            if [ "${result%% *}" = completed ]; then
              [ "${result#* }" = success ] || { echo "::error::release run $run_id: $result"; exit 1; }
              break
            fi
            sleep 30
          done
          [ "${result%% *}" = completed ] || { echo "::error::release run $run_id timed out"; exit 1; }
          release_tag=$(gh release list --limit 100 --json tagName --jq ".[].tagName | select(endswith(\"-r$run_id\"))" | head -1)
          [ -n "$release_tag" ] || { echo "::error::formal release for run $run_id is missing"; exit 1; }
          test "$(gh release view "$release_tag" --json isPrerelease --jq .isPrerelease)" = false

          {
            echo "## Honk upstream update published"
            echo ""
            echo "Staging branch: \`$STAGING\`"
            echo "Validated commit: \`${{ steps.stage.outputs.staging_sha }}\`"
            echo "Formal release: \`$release_tag\`"
            echo ""
            echo "Doona, Honk core and all 12 SDK package sets passed; main, Release and R2 were updated."
          } >> "$GITHUB_STEP_SUMMARY"
