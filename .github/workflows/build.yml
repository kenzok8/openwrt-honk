name: Build Honk packages

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: Build pinned Doona interface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check package metadata and scripts
        run: bash scripts/check.sh
      - name: Build pinned Doona interface
        run: ci/build-doona.sh
      - uses: actions/upload-artifact@v4
        with:
          name: honk-source-build
          path: |
            artifacts/cache/*.tar.gz
            luci-app-honk/generated-doona-stage.mk
          if-no-files-found: error
          retention-days: 7
