name: Build Honk packages

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: Build pinned Doona interface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check package metadata and scripts
        run: bash scripts/check.sh
      - name: Build pinned Doona interface
        run: ci/build-doona.sh
      - uses: actions/upload-artifact@v4
        with:
          name: honk-source-build
          path: |
            artifacts/cache/*.tar.gz
            luci-app-honk/generated-doona-stage.mk
          if-no-files-found: error
          retention-days: 7

  sdk-build:
    name: Build x86_64 APKs with pinned OpenWrt SDK
    if: github.event_name == 'workflow_dispatch'
    needs: source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: honk-source-build
          path: .
      - name: Install SDK build tools
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd ripgrep
      - name: Build packages with the pinned SDK
        run: ci/build-sdk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: honk-openwrt-x86_64-apks
          path: artifacts/apk/*
          if-no-files-found: error
          retention-days: 14
