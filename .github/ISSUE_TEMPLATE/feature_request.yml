name: 功能建议
description: 想要的新功能、界面改进或体验优化
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        内核本身支持什么协议、什么写法，先看 [上游协议参考](https://github.com/daeuniverse/honk/blob/main/doc/zh/reference/nodes.md)。
        honk-core 的能力由上游决定，这个仓库负责 OpenWrt 打包、LuCI 界面和默认配置。

        > 可以用 AI 辅助撰写，但提交前须逐条核实全部内容。

  - type: dropdown
    id: scope
    attributes:
      label: 建议范围
      options:
        - LuCI 界面
        - 默认配置与策略组
        - 订阅与节点导入
        - 安装、升级与维护
        - 文档与翻译
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么、卡在哪
      placeholder: 机场订阅里的 TUIC 节点用了 quic 转发，导入后整条被丢掉，界面上看不到原因
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
      description: 希望它长什么样、怎么操作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前的做法
      description: 现在怎么绕过去的，或者别的插件是怎么做的

  - type: checkboxes
    id: self-check
    attributes:
      label: 自查
      options:
        - label: 已搜索过现有 issue
        - label: 确认这不是上游 honk-core 的能力范围
        - label: 内容已核实（含 AI 辅助撰写的部分）
